[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepdream"
version = "1.0.0"
description = "A PyTorch implementation of DeepDream using InceptionV3"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "Pillow>=9.0.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = ["matplotlib>=3.5.0"]
